# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - MoonGPT-ALPHA

on:
  push:
    branches:
      - new
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://moonappacr-agg8b9h6gxdgd5aj.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_7c66471669f74d8cba4ac587884671f1 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_1bd24775660c4c76a531fe065f122873 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: moonappacr-agg8b9h6gxdgd5aj.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_7c66471669f74d8cba4ac587884671f1 }}/sample-app-aoai-chatgpt:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'MoonGPT-ALPHA'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_da7f1c5effbb479197fe76e582b0377a }}
        images: 'moonappacr-agg8b9h6gxdgd5aj.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_7c66471669f74d8cba4ac587884671f1 }}/sample-app-aoai-chatgpt:${{ github.sha }}'