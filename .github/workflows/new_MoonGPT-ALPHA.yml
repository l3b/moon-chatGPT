# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - MoonGPT-ALPHA

on:
  push:
    branches:
      - new
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://moonappacr-agg8b9h6gxdgd5aj.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_dd6179a61afc4f68a296b463100d0946 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_b32e644d7e584b4393c42568bbc5117b }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: moonappacr-agg8b9h6gxdgd5aj.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_dd6179a61afc4f68a296b463100d0946 }}/moon:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'MoonGPT-ALPHA'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_e0d5d954bffe45579ace9cab846500b5 }}
        images: 'moonappacr-agg8b9h6gxdgd5aj.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_dd6179a61afc4f68a296b463100d0946 }}/moon:${{ github.sha }}'